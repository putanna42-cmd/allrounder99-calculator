name: Build FP24 Panel Viewer APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'fp24-panel-viewer/**'
      - '.github/workflows/fp24-panel-viewer-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fp24-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace -p fp24-panel-viewer assembleDebug

      - name: Verify APK signature and contents
        shell: bash
        run: |
          APK="fp24-panel-viewer/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -s "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -F "classes.dex"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FP24-Panel-Viewer-APK
          path: fp24-panel-viewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
